- id: m36-059
  module: 36
  lesson: "36.6"
  subject: own-affairs
  difficulty: 2
  question: >-
    Why does supplied question B ask for a section of a law that governs your own affairs?
  options:
    - >-
      Because laws about daily life have the longest legislative histories.
