- id: m36-057
  module: 36
  lesson: "36.6"
  subject: timeline
  difficulty: 2
  question: >-
    In the 12-week plan, when is the introduction written?
  options:
    - >-
      Last in the drafting stage, after the argument chapters.
    - >-
      First, in week 1, before any of the research has been done.
    - >-
      Only after submission, when it is rewritten as an abstract.
    - >-
      During the presentation, based on the audience's comments.
  correct: 0
