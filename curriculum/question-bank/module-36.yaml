- id: m36-058
  module: 36
  lesson: "36.6"
  subject: integrity
  difficulty: 2
  question: >-
    During round 2 of peer review, Omer sees a strong idea in his reviewer's paper that would fit his own. What should he do?
  options:
    - >-
      Use it, since peer review is a shared exercise and ideas may circulate.
    - >-
