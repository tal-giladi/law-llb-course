- id: m21-059
  module: 21
  lesson: "21.6"
  subject: integrity
  difficulty: 3
  question: >-
    During the final check you cannot find one AI-suggested ruling on any free host or database. Your
    deadline is tonight. What do you do?
  options:
    - >-
      Keep it, since the tool gave a precise case number.
    - >-
      Keep it with "לא פורסם" instead of a database.
    - >-
      Delete it and adjust the text that relied on it.
    - >-
      Replace it with a similar-sounding ruling you have not read.
  correct: 2
  explanation: >-
