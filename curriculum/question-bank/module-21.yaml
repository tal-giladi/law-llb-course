  correct: 3
  explanation: >-
    The authors report that the Court held the purpose test cannot be dropped, while reading the
    purposes broadly.
- id: m21-051
  module: 21
  lesson: "21.6"
  subject: writing-process
  difficulty: 1
  question: >-
