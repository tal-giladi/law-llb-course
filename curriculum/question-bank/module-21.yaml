- id: m21-054
  module: 21
  lesson: "21.6"
  subject: peer-review
  difficulty: 2
  question: >-
    As a peer reviewer, you find a weak paragraph in a classmate's paper. What should you do?
  options:
    - >-
      Rewrite the whole paragraph for them in track changes.
    - >-
      Ignore it, since critical comments may hurt the author.
    - >-
      Tell the lecturer about it before telling the author.
