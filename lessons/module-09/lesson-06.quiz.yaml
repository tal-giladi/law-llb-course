- id: q1
  question: >-
    A classmate writes that Nahmani "holds that a spouse may always withdraw consent to IVF". What is
    wrong with this statement?
  options:
    - >-
      Nahmani did not concern IVF at all but a dispute over a surrogacy contract's price.
    - >-
      Nahmani held that the hospital alone decides, so the spouses' consent was irrelevant.
    - >-
      Nahmani was decided under the 1996 Embryo Carrying Agreements Law, which settles the point.
    - >-
      That was the 1995 appeal's view; the further hearing reversed it 7–4 in favour of Ruth.
  correct: 3
  explanation: >-
    The 4–1 appeal judgment, which required continuing consent, was reversed at the further hearing.
    Always check the procedural history before citing a ruling as the law.
- id: q2
  question: >-
    Justice Goldberg wrote that, with no normative arrangement, the case is decided by the basic value
    of justice. In the four-column worksheet, where does this belong most clearly?
  options:
    - >-
      Under natural law, as an appeal to justice as the standard behind positive law.
    - >-
      Under positivism, because justice is written in a specific statute he applied.
    - >-
      Under realism, because he openly predicted how other courts would decide.
    - >-
      Under none, because statements about justice are obiter and not reasoning.
  correct: 0
  explanation: >-
    Deciding by "justice" when positive sources run out is the closest of the opinions to a natural-law
    method. A positivist would also note the gap and call what follows discretion.
- id: q3
  question: >-
    Justice Strasberg-Cohen, in the minority, cited Dworkin and argued that refusing to force parenthood
    is itself a principled decision. What does this show about law as integrity?
  options:
    - >-
      That integrity always favours the party relying on an earlier consent.
    - >-
      That Dworkin's theory requires judges to follow the majority of a larger panel.
    - >-
      That integrity sets the kind of argument required, not which side wins.
    - >-
      That Dworkinian reasoning applies only where a statute governs the case.
  correct: 2
  explanation: >-
    Both sides argued from principles (consent, autonomy, reliance, the value of parenthood). Integrity
    requires arguments of principle that fit and justify the law; it does not by itself pick the winner.
- id: q4
  question: >-
    You have finished your four-theory analysis and favour Ruth's side. What should your one-page
    argument from principle do in this lab?
  options:
    - >-
      Restate your own view in more detail, so the reader sees why Ruth should win.
    - >-
      Argue Daniel's side at its strongest, so that its supporters would accept it as fair.
    - >-
      Summarise all eleven opinions equally, without taking any position.
    - >-
      Explain why the theories are irrelevant once the Supreme Court has decided.
  correct: 1
  explanation: >-
    Step 6 asks you to argue for the side you did not favour. Stating the opposing case at its
    strongest is the best test of whether you understand the ruling.
